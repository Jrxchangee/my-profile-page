<!DOCTYPE html>

<html>
  <head>
    <title>Contact Us</title>
  </head>

  <body>
    <header id="home">
            <h1>Dev Portfolio</h1>
            <nav>
                <ul>
                    <li><a href="./">Home</a></li>
                    <li><a href="Registrationform.html">Registration</a></li>
                    <li><a href="contactus.html">ContactUs</a></li>
                    <li><a href="loginform.html">Login</a></li>

                </ul>
            </nav>
        </header>
    <h2>Contact Us</h2>
    <main>

        <form action="#" method="post">
        <div>
            <label for="fullname">Name</label>
            <input type="text" id="fullname" name="fullname" required />
        </div>

        <br />

        <div>
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required />
        </div>

        <br />

        <div>
            <label for="number">Contact Number</label>
            <input type="text" id="number" name="number" required />
        </div>

        <br />

        <div>
            <label for="complaint">Enter your complaint</label>
            <br>
            <textarea id="complaint" name="complaint" rows="4" cols="50" required>Enter text here...</textarea
            >
        </div>

        <br />

        <div>
            <input type="checkbox" id="terms" name="terms" />
            <label for="terms"
            >I have read and agree with the terms and condition</label
            >
        </div>

        <br />
        <button type="submit">Submit</button>
        </form>

    </main>
  </body>
</html>
